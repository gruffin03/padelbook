<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PadelBook Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================
   VARIABLES — THÈME CLAIR PASTEL
   ============================================ */
:root {
  --bg:       #f2f4f6;
  --bg2:      #ffffff;
  --surface:  #ffffff;
  --text:     #1a1a2e;
  --text2:    #4a4a6a;
  --muted:    #8888aa;
  --border:   rgba(0,0,0,0.07);

  /* Dégradé header — teal mint */
  --grad-start: #b2f0e8;
  --grad-end:   #e8f8f5;

  /* Palette cartes coachs — cyclique */
  --c1: #c8b6ff; /* lavande */
  --c2: #ffe066; /* jaune */
  --c3: #ffb3a7; /* corail */
  --c4: #a0e4cb; /* menthe */
  --c5: #ffd6a5; /* pêche */
  --c6: #b5d8ff; /* bleu ciel */
  --c7: #f9c6d0; /* rose */
  --c8: #d4f5a5; /* vert pomme */

  --gold:     #c9943a;
  --gold-acc: #d4a843;
  --gold-lt:  #fff3cc;

  --radius-lg: 24px;
  --radius-xl: 32px;
  --shadow:    0 4px 24px rgba(0,0,0,0.08);
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
}

/* ============================================
   RESET & BASE
   ============================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body { overflow-x: hidden; max-width: 100vw; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  padding-bottom: 80px; /* espace bottom nav */
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; font-size: 14px; outline: none; border: none; }
a { color: inherit; text-decoration: none; }

/* ============================================
   LAYOUT
   ============================================ */
#app { min-height: 100vh; }
.container    { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.container-sm { max-width: 560px; margin: 0 auto; padding: 0 20px; }

/* ============================================
   TYPOGRAPHIE
   ============================================ */
.title-xl { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 900; line-height: 1.1; color: var(--text); }
.title-lg { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; }
.title-md { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; }
.label    { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }

/* ============================================
   NAVBAR — claire, épurée
   ============================================ */
.navbar {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  padding: 0 20px;
}
.navbar-inner {
  max-width: 900px; margin: 0 auto;
  height: 58px; display: flex; align-items: center; justify-content: space-between;
}
.navbar-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.navbar-logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #5be0c8, #2cc4a8);
  border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 16px;
  box-shadow: 0 4px 12px rgba(44,196,168,0.3);
}
.navbar-logo-text { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 900; color: var(--text); }
.navbar-logo-text span { color: #2cc4a8; }
.navbar-actions { display: flex; align-items: center; gap: 8px; }
.navbar-user {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 20px;
  background: var(--bg); border: 1px solid var(--border);
  cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2);
}

/* ============================================
   BOTTOM NAV (mobile)
   ============================================ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 16px 14px; z-index: 100;
}
.bn-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; flex: 1; padding: 4px;
  border-radius: 12px; transition: all 0.2s;
}
.bn-icon {
  width: 42px; height: 42px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all 0.2s;
}
.bn-item.active .bn-icon {
  background: linear-gradient(135deg, #1a2e28, #2cc4a8);
  box-shadow: 0 4px 14px rgba(44,196,168,0.3);
}
.bn-label { font-size: 10px; font-weight: 600; color: var(--muted); }
.bn-item.active .bn-label { color: #2cc4a8; }

/* ============================================
   HERO — dégradé teal, card de recherche
   ============================================ */
.hero {
  background: linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
  padding: 36px 20px 48px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: '🎾';
  position: absolute; right: -10px; top: 20px;
  font-size: 120px; opacity: 0.08;
  transform: rotate(20deg);
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; font-weight: 700; color: #2cc4a8;
  backdrop-filter: blur(10px); margin-bottom: 16px;
}
.search-card {
  background: white;
  border-radius: var(--radius-xl);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-top: 24px;
  max-width: 560px;
}
.search-row { display: flex; gap: 10px; }
.search-input {
  flex: 1; padding: 13px 16px; border-radius: 14px;
  background: var(--bg); border: none; color: var(--text);
  font-size: 14px; font-family: inherit;
}
.search-input:focus { outline: 2px solid #5be0c8; }
.search-input::placeholder { color: var(--muted); }
.search-filters {
  display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
}
.filter-pill {
  padding: 7px 14px; border-radius: 20px;
  background: var(--bg); border: 1.5px solid transparent;
  font-size: 12px; font-weight: 700; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
}
.filter-pill.active { background: #e8faf7; border-color: #2cc4a8; color: #2cc4a8; }
.filter-pill:hover { border-color: #5be0c8; }
.filter-select {
  padding: 7px 14px; border-radius: 20px;
  background: var(--bg); border: 1.5px solid transparent;
  font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer;
}
.filter-select option { background: white; }

/* ============================================
   SECTION TITLE — style "Activity"
   ============================================ */
.section-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin: 28px 0 16px;
}
.section-count {
  font-family: 'Inter', sans-serif;
  font-size: 48px; font-weight: 900; line-height: 1;
  color: #1a2e28;
}
.section-count-label {
  font-size: 13px; color: var(--muted); font-weight: 600;
  margin-left: 6px; margin-bottom: 6px;
}

/* ============================================
   COACH CARDS — Clean, aéré, moderne
   ============================================ */
.coaches-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 8px 0 24px;
}

.blob-card {
  background: white;
  border-radius: 20px;
  padding: 18px 18px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  border: 1.5px solid rgba(0,0,0,0.05);
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}
.blob-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(0,0,0,0.11);
}

/* Bande colorée en haut */
.blob-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 20px 20px 0 0;
}

/* Ligne haute — avatar + nom + prix */
.blob-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Avatar rond coloré */
.blob-circle {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  color: rgba(0,0,0,0.42);
  flex-shrink: 0;
}

.blob-info { flex: 1; }
.blob-name {
  font-size: 15px;
  font-weight: 800;
  color: #0d2a22;
  line-height: 1.2;
}
.blob-spec {
  font-size: 11px;
  color: #7a9a90;
  margin-top: 2px;
}
.blob-price {
  font-size: 20px;
  font-weight: 900;
  color: #0d2a22;
  white-space: nowrap;
  flex-shrink: 0;
}
.blob-price sup {
  font-size: 10px;
  font-weight: 500;
  color: #8aaa9a;
  vertical-align: super;
}

/* Ligne basse — méta + bouton */
.blob-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.06);
}
.blob-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.blob-loc, .blob-rating, .blob-dispo {
  font-size: 11px;
  color: #8aaa9a;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 3px;
}
.dispo-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #2cc4a8;
  display: inline-block;
}
.blob-cta {
  padding: 8px 16px;
  border-radius: 20px;
  background: #0d2a22;
  color: white;
  font-size: 11px;
  font-weight: 800;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
  transition: background 0.15s;
  flex-shrink: 0;
}
.blob-cta:hover { background: #1a6654; }

/* Couleurs de la bande + avatar */
.bc-0  .blob-circle { background: #C8B4F8; } .bc-0::before  { background: #C8B4F8; }
.bc-1  .blob-circle { background: #F9E84E; } .bc-1::before  { background: #F9E84E; }
.bc-2  .blob-circle { background: #FAA27A; } .bc-2::before  { background: #FAA27A; }
.bc-3  .blob-circle { background: #A8E6CF; } .bc-3::before  { background: #A8E6CF; }
.bc-4  .blob-circle { background: #A8D8EA; } .bc-4::before  { background: #A8D8EA; }
.bc-5  .blob-circle { background: #FFD3A5; } .bc-5::before  { background: #FFD3A5; }
.bc-6  .blob-circle { background: #B5EAD7; } .bc-6::before  { background: #B5EAD7; }
.bc-7  .blob-circle { background: #FFE08A; } .bc-7::before  { background: #FFE08A; }
.bc-8  .blob-circle { background: #BDE0FE; } .bc-8::before  { background: #BDE0FE; }
.bc-9  .blob-circle { background: #F4B8C8; } .bc-9::before  { background: #F4B8C8; }
.bc-10 .blob-circle { background: #D4BBFF; } .bc-10::before { background: #D4BBFF; }
.bc-11 .blob-circle { background: #C8F4C8; } .bc-11::before { background: #C8F4C8; }
.bc-12 .blob-circle { background: #FFCBA4; } .bc-12::before { background: #FFCBA4; }
.bc-13 .blob-circle { background: #B8E4F4; } .bc-13::before { background: #B8E4F4; }
.bc-14 .blob-circle { background: #E0C8F8; } .bc-14::before { background: #E0C8F8; }
.bc-15 .blob-circle { background: #F8F0A0; } .bc-15::before { background: #F8F0A0; }
.bc-16 .blob-circle { background: #F4C4A8; } .bc-16::before { background: #F4C4A8; }
.bc-17 .blob-circle { background: #A8DCF0; } .bc-17::before { background: #A8DCF0; }
.bc-18 .blob-circle { background: #F8C8D8; } .bc-18::before { background: #F8C8D8; }
.bc-19 .blob-circle { background: #C4F0D4; } .bc-19::before { background: #C4F0D4; }

/* ============================================
   COMPOSANTS COMMUNS
   ============================================ */
.btn {
  padding: 12px 20px; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  transition: all 0.18s;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; cursor: pointer;
}
.btn-primary {
  background: linear-gradient(135deg, #1a2e28, #2cc4a8); color: #fff;
  box-shadow: 0 4px 16px rgba(44,196,168,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(44,196,168,0.4); }
.btn-secondary {
  background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text2);
}
.btn-secondary:hover { border-color: #2cc4a8; color: #2cc4a8; }
.btn-danger { background: #fff0f0; border: 1.5px solid #ffd0d0; color: #e05555; }
.btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 9px; }
.btn-full { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

/* Cards blanches pour les détails */
.card {
  background: white; border-radius: var(--radius-lg);
  padding: 20px; box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.card-teal { background: #e8faf7; border-color: rgba(44,196,168,0.2); }
.card-green { background: #e8faf7; border: 2px solid #2cc4a8; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
}
.badge-green  { background: #e8faf7; color: #2cc4a8; border: 1px solid rgba(44,196,168,0.3); }
.badge-orange { background: #fff8e8; color: #d4a843; border: 1px solid rgba(44,196,168,0.3); }
.badge-red    { background: #fff0f0; color: #e05555; border: 1px solid rgba(224,85,85,0.3); }
.badge-blue   { background: #e8f4ff; color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
.badge-gray   { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

/* Stars */
.stars { color: #f4a800; letter-spacing: 1px; }
.stars-sm { font-size: 12px; }

/* Inputs */
.input-group { margin-bottom: 16px; }
.input-group label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.input-field {
  width: 100%; padding: 12px 14px; background: var(--bg);
  border: 1.5px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 14px; transition: border 0.2s;
}
.input-field:focus { border-color: #2cc4a8; outline: none; }
.input-field::placeholder { color: var(--muted); }
select.input-field { cursor: pointer; }

/* Avatar */
.avatar {
  border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: 700;
  font-family: 'Inter', sans-serif; flex-shrink: 0;
}
.avatar-lg { width: 72px; height: 72px; font-size: 24px; }
.avatar-md { width: 48px; height: 48px; font-size: 16px; }
.avatar-sm { width: 36px; height: 36px; font-size: 12px; }

/* Tabs */
.tabs {
  display: flex; gap: 4px; background: var(--bg);
  border-radius: 14px; padding: 4px; margin-bottom: 20px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 9px 16px; border-radius: 10px;
  font-size: 12px; font-weight: 700; color: var(--muted);
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.tab.active { background: linear-gradient(135deg, #1a2e28, #2cc4a8); color: white; }

/* Calendrier */
.days-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 8px; scrollbar-width: none;
}
.days-scroll::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0; min-width: 52px; padding: 10px 8px;
  border-radius: 14px; text-align: center; cursor: pointer;
  background: var(--bg); border: 1.5px solid transparent; transition: all 0.2s;
}
.day-btn.active { background: linear-gradient(135deg, #1a2e28, #2cc4a8); color: white; }
.day-btn .day-name { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
.day-btn.active .day-name { color: rgba(255,255,255,0.6); }
.day-btn .day-num { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }
.day-btn.active .day-num { color: white; }

.slots-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.slot-btn {
  padding: 9px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 700;
  background: var(--bg); border: 1.5px solid transparent;
  cursor: pointer; color: var(--text2); transition: all 0.15s;
}
.slot-btn:hover { border-color: #2cc4a8; color: #2cc4a8; }
.slot-btn.active { background: linear-gradient(135deg, #1a2e28, #2cc4a8); color: white; border-color: transparent; }
.slot-btn.booked { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

/* Avis */
.review-card { padding: 16px 0; border-bottom: 1px solid var(--border); }
.review-card:last-child { border-bottom: none; }
.review-header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.review-meta { flex: 1; }
.review-author { font-weight: 700; font-size: 14px; color: var(--text); }
.review-date { font-size: 11px; color: var(--muted); }
.review-text { font-size: 14px; color: var(--text2); line-height: 1.6; }

/* Dashboard */
.dashboard-header {
  background: linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
  padding: 28px 20px 36px;
}

/* Booking items */
.booking-item {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow-sm);
}
.booking-info { flex: 1; }
.booking-name { font-weight: 800; font-size: 15px; color: var(--text); }
.booking-detail { font-size: 12px; color: var(--muted); margin-top: 3px; }
.booking-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Table admin */
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th {
  text-align: left; padding: 10px 14px;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.admin-table td { padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 13px; color: var(--text); }
.admin-table tr:hover td { background: var(--bg); }

/* Toast */
#toast {
  position: fixed; bottom: 90px; right: 20px;
  background: #1a2e28; color: white;
  padding: 14px 20px; border-radius: 14px;
  font-weight: 700; font-size: 14px;
  z-index: 9999; transform: translateY(80px); opacity: 0;
  transition: all 0.3s; pointer-events: none;
  box-shadow: 0 8px 24px rgba(44,196,168,0.25);
}
#toast.show { transform: translateY(0); opacity: 1; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 1000; display: flex; align-items: center;
  justify-content: center; padding: 20px;
}
.modal {
  background: white; border-radius: var(--radius-xl);
  padding: 28px; width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.2);
}

/* Auth */
.auth-container { max-width: 420px; margin: 40px auto; padding: 0 20px; }
.auth-card {
  background: white; border-radius: var(--radius-xl);
  padding: 32px; box-shadow: var(--shadow);
}
.role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.role-btn {
  padding: 16px; border-radius: var(--radius-lg); text-align: center;
  cursor: pointer; border: 2px solid var(--border);
  background: var(--bg); transition: all 0.2s;
}
.role-btn.active { border-color: #2cc4a8; background: #e8faf7; }
.role-btn .role-icon { font-size: 26px; margin-bottom: 6px; }
.role-btn .role-label { font-size: 12px; font-weight: 800; color: var(--text2); }

/* Tarifs */
.tarifs-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;
}
.tarif-card {
  background: var(--bg); border-radius: var(--radius-lg);
  padding: 16px; text-align: center; border: 1px solid var(--border);
}
.tarif-price { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 900; color: var(--text); }
.tarif-type { font-size: 12px; color: var(--text2); font-weight: 700; margin-top: 4px; }
.tarif-dur { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Service cards booking */
.service-card {

/** Génère des disponibilités aléatoires pour les 14 prochains jours */
function genDispos() {
  const dispos = {};
  const SLOTS_SEM = ['8:00','8:30','9:00','9:30','10:00','17:00','17:30','18:00','18:30','19:00','19:30','20:00'];
  const SLOTS_WE  = ['9:00','9:30','10:00','10:30','11:00','14:00','14:30','15:00','15:30','16:00','16:30'];
  for (let i = 1; i <= 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    if (d.getDay() === 0) continue;
    const pool = d.getDay() === 6 ? SLOTS_WE : SLOTS_SEM;
    const slots = pool.filter(() => Math.random() > 0.35);
    if (slots.length) dispos[dateStr(d)] = slots;
  }
  return dispos;
}

function dateStr(d) {
  return d.toISOString().split('T')[0];
}

function dateLabel(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

/** Calcule la distance approximative en km entre deux points (Haversine) */
function distance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

const PLANS = {
  decouverte: { label: 'Découverte', price: 0, color: '#9a9080', badge: '🆓', limit: 5,  priority: 0 },
  essentiel:  { label: 'Essentiel',  price: 9, color: '#c9a84c', badge: '⭐', limit: 999, priority: 1 },
};

function planBadgeHtml(plan) {
  const p = PLANS[plan] || PLANS.decouverte;
  return `<span class="badge" style="background:rgba(44,196,168,0.15);color:${p.color};border:1px solid ${p.color}44">${p.badge} ${p.label}</span>`;
}

function planExpiryLabel(coach) {
  if (!coach.planExpiry) return 'Pas d\'abonnement actif';
  const d = new Date(coach.planExpiry);
  const now = new Date();
  if (d < now) return '❌ Expiré le ' + d.toLocaleDateString('fr-FR');
  const days = Math.ceil((d - now) / 86400000);
  return `✅ Expire dans ${days} jours (${d.toLocaleDateString('fr-FR')})`;
}

function makeGCalLink({ title, date, heure, duree = 60, lieu, description }) {
  const [year, month, day] = date.split('-');
  const [hour, min] = heure.split(':');
  const start = `${year}${month}${day}T${hour.padStart(2,'0')}${(min||'00').padStart(2,'0')}00`;

  const endDate = new Date(+year, +month - 1, +day, +hour, +(min||0) + duree);
  const ey = String(endDate.getFullYear());
  const emo = String(endDate.getMonth() + 1).padStart(2,'0');
  const ed = String(endDate.getDate()).padStart(2,'0');
  const eh = String(endDate.getHours()).padStart(2,'0');
  const em = String(endDate.getMinutes()).padStart(2,'0');
  const end = `${ey}${emo}${ed}T${eh}${em}00`;

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title || 'Cours Padel',
    dates: `${start}/${end}`,
    details: description || '',
    location: lieu || '',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendBrowserNotif(title, body, icon = '🎾') {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>' });
  }
}

function starsHtml(note, small = false) {
  const cls = small ? 'stars stars-sm' : 'stars';
  return `<span class="${cls}">${'★'.repeat(Math.round(note))}${'☆'.repeat(5 - Math.round(note))}</span>`;
}

function avatarHtml(initiales, color, size = 'md', photoUrl = null) {
  if (photoUrl) {
    return `<div class="avatar avatar-${size}" style="background:${color||'linear-gradient(135deg,#5be0c8,#2cc4a8)'};overflow:hidden;padding:0"><img src="${photoUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;
  }
  const textColor = color && (color.includes('1a472a') || color.includes('1e3a8a') || color.includes('1a1a') || color.includes('#0')) ? '#fff' : 'rgba(0,0,0,0.65)';
  return `<div class="avatar avatar-${size}" style="background:${color||'linear-gradient(135deg,#5be0c8,#2cc4a8)'};color:${textColor}">${initiales}</div>`;
}

function toast(msg, color = '#c9a84c') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = color;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Convertit snake_case → camelCase (clés top-level uniquement)
function toCamel(obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return obj;
  const out = {};
  for (const [k, v] of Object.entries(obj))
    out[k.replace(/_([a-z])/g, (_, c) => c.toUpperCase())] = v;
  return out;
}

// Convertit camelCase → snake_case (clés top-level uniquement)
function toSnake(obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return obj;
  const out = {};
  for (const [k, v] of Object.entries(obj))
    out[k.replace(/[A-Z]/g, m => '_' + m.toLowerCase())] = v;
  return out;
}

// SECTION 3 — BASE DE DONNÉES (Supabase + cache mémoire)
// ============================================================
const DB = {
  _cache: { coaches: [], bookings: [], reviews: [], users: [], messages: [] },

  async init() {
    try {
      const [cRes, bRes, rRes, mRes] = await Promise.all([
        sb.from('coaches').select('*'),
        sb.from('bookings').select('*'),
        sb.from('reviews').select('*'),
        sb.from('messages').select('*'),
      ]);
      this._cache.coaches  = (cRes.data  || []).map(toCamel);
      this._cache.bookings = (bRes.data  || []).map(toCamel);
      this._cache.reviews  = (rRes.data  || []).map(toCamel);
      this._cache.messages = (mRes.data  || []).map(toCamel);
    } catch(e) {
      console.warn('Supabase init failed:', e);
    }
  },

  async refresh(table) {
    try {
      const { data } = await sb.from(table).select('*');
      this._cache[table] = (data || []).map(toCamel);
    } catch(e) { console.warn('Supabase refresh failed:', table, e); }
  },

  get(table) { return this._cache[table] || []; },

  // insert : async — attend la réponse Supabase pour obtenir l'UUID réel
  async insert(table, record) {
    const payload = toSnake(record);
    delete payload.id; // laisser Supabase générer l'UUID
    const { data, error } = await sb.from(table).insert(payload).select().single();
    if (error) throw error;
    const mapped = toCamel(data);
    this._cache[table] = [...(this._cache[table] || []), mapped];
    return mapped;
  },

  // update / delete : optimiste (cache mis à jour immédiatement, Supabase en arrière-plan)
  update(table, id, updates) {
    const idx = (this._cache[table] || []).findIndex(r => r.id === id);
    if (idx !== -1) Object.assign(this._cache[table][idx], updates);
    sb.from(table).update(toSnake(updates)).eq('id', id)
      .then(({ error }) => { if (error) console.error('Supabase update error:', table, error); });
  },

  delete(table, id) {
    this._cache[table] = (this._cache[table] || []).filter(r => r.id !== id);
    sb.from(table).delete().eq('id', id)
      .then(({ error }) => { if (error) console.error('Supabase delete error:', table, error); });
  },
};

  async logout() {
    await sb.auth.signOut();
    this.currentUser = null;
    localStorage.removeItem('pb_role');
  },

  async restore() {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      this.currentUser = await this._loadProfile(session.user.id);
      if (this.currentUser) this.currentUser.email = session.user.email;
      if (this.currentUser?.role) localStorage.setItem('pb_role', this.currentUser.role);

      // Popup bienvenue après redirect Google (flag posé avant le redirect)
      const googleTs = localStorage.getItem('pb_google_ts');
      if (googleTs && (Date.now() - parseInt(googleTs)) < 300000) {
        localStorage.removeItem('pb_google_ts');
        const created = new Date(session.user.created_at).getTime();
        if ((Date.now() - created) < 180000 && this.currentUser) {
          setTimeout(() => showWelcomePopup(this.currentUser.role, this.currentUser.prenom), 800);
        }
      }
    }
    sb.auth.onAuthStateChange(async (event, session) => {
      if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') && session?.user) {
        const wasLoggedIn = !!this.currentUser;
        if (!this.currentUser) {
          this.currentUser = await this._loadProfile(session.user.id);
          if (this.currentUser) this.currentUser.email = session.user.email;
          await DB.init();
        }
        // Rediriger hors de la page d'accueil si on y est encore
        if (App.view === 'home' || App.view === 'home-joueur' || App.view === 'home-coach') {
          const role = this.currentUser?.role;
          if (role === 'admin') App.go('admin');
          else if (role === 'coach') App.go('coach-dashboard');
          else App.go('search');
        } else {
          App.render();
        }
      }
      if (event === 'SIGNED_OUT') {
        this.currentUser = null;
        App.go('home');
      }
    });
  },

  async _loadProfile(userId) {
    const { data: profile } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (!profile) return null;
    const p = toCamel(profile);
    // Charger le profil coach si présent
    if (p.coachId) {
      const { data: coach } = await sb.from('coaches').select('*').eq('id', p.coachId).single();
      if (coach) p.coachProfile = toCamel(coach);
    }
    return p;
  },
};

  toggleFaq(i) {
    const el = document.getElementById('faq-a-' + i);
    const arrow = document.getElementById('faq-arrow-' + i);
    if (!el) return;
    const isOpen = el.classList.contains('open');
    el.classList.toggle('open', !isOpen);
    if (arrow) arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(45deg)';
  },

  buildCoachesGrid() {
    const coaches = DB.get('coaches').filter(c => c && c.validated);
    let filtered = coaches.filter(c => {
      const q = this.searchQuery.toLowerCase();
      const match = !q || c.ville.toLowerCase().includes(q) || c.codePostal.includes(q) || c.nom.toLowerCase().includes(q);
      const niv = !this.filterNiveau || c.niveaux.includes(this.filterNiveau);
      const prix = !this.filterPrixMax || c.tarifs.solo <= parseInt(this.filterPrixMax);
      const dispo = !this.filterDispo || Object.keys(c.disponibilites).length > 0;
      return match && niv && prix && dispo;
    });
    const todayKey = (() => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
    if (this.filterSort === 'dispo') {
      filtered = filtered.filter(c => c.disponibilites && c.disponibilites[todayKey]);
    }
    filtered.sort((a, b) => {
      if (this.filterSort === 'note') return (b.rating||0) - (a.rating||0);
      if (this.filterSort === 'prix') return (a.tarifs?.solo||0) - (b.tarifs?.solo||0);
      // Pertinence : plan priority first, then distance
      const pa = (PLANS[a.plan]||PLANS.decouverte).priority;
      const pb2 = (PLANS[b.plan]||PLANS.decouverte).priority;
      if (pb2 !== pa) return pb2 - pa;
      if (this.userLocation) {
        return distance(this.userLocation.lat,this.userLocation.lng,a.lat,a.lng)
             - distance(this.userLocation.lat,this.userLocation.lng,b.lat,b.lng);
      }
      return 0;
    });
    // Attribution couleurs — jamais deux adjacentes identiques
    const N = 20;
    const colorIdx = [];
    filtered.forEach((_, i) => {
      let c = i % N;
      // Si même que le précédent, décaler
      if (i > 0 && c === colorIdx[i-1]) c = (c + 1) % N;
      colorIdx.push(c);
    });
    const cards = filtered.length
      ? filtered.map((c, i) => this.buildBlobCard(c, colorIdx[i])).join('')
      : '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Aucun coach trouvé</div></div>';
    return '<div class="coaches-list">' + cards + '</div>';
  },

  buildBlobCard(coach, ci) {
    const _td = (() => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
    const firstDispo = Object.keys(coach.disponibilites || {}).sort().find(d => d >= _td);
    const dispo = firstDispo ? dateLabel(firstDispo) : 'Aucune dispo';
    const dist = this.userLocation
      ? distance(this.userLocation.lat, this.userLocation.lng, coach.lat, coach.lng) + ' km · '
      : '';
    const plan = coach.plan || 'decouverte';
    const isPaid = plan === 'essentiel';
    return '<div class="blob-card bc-' + ci + '" data-coach-id="' + coach.id + '" onclick="App.openCoach(this.dataset.coachId)">'
      + '<div class="blob-top">'
        + '<div class="blob-circle">' + coach.initiales + '</div>'
        + '<div class="blob-info">'
          + '<div class="blob-name">' + coach.nom + (isPaid ? ' <span style="font-size:10px;background:#c9a84c;color:white;padding:2px 6px;border-radius:8px;font-weight:700;vertical-align:middle">⭐ ESSENTIEL</span>' : '') + '</div>'
          + '<div class="blob-spec">' + coach.specialite + '</div>'
        + '</div>'
        + '<div class="blob-price">' + coach.tarifs.solo + '€<sup>/h</sup></div>'
      + '</div>'
      + '<div class="blob-bottom">'
        + '<div class="blob-meta">'
          + '<span class="blob-loc">📍 ' + coach.ville + '</span>'
          + '<span class="blob-rating">★ ' + (coach.rating || '–') + ' (' + (coach.nbAvis || 0) + ')</span>'
          + '<span class="blob-dispo"><span class="dispo-dot"></span>' + dist + dispo + '</span>'
        + '</div>'
        + '<button style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px" data-id="' + coach.id + '" onclick="event.stopPropagation();App.toggleFavori(this.dataset.id)">' + (this.isFavori(coach.id) ? '❤️' : '🤍') + '</button>'
        + '<button class="blob-cta" data-id="' + coach.id + '" onclick="event.stopPropagation();App.openCoach(this.dataset.id)">Réserver →</button>'
      + '</div>'
    + '</div>';
  },

        <div class="day-name">${new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div>
        <div class="day-num">${new Date(d+'T00:00:00').getDate()}</div>
      </div>`;
    }).join('');

    let slotsHtml = '';
    if (this.selectedDate && coach.disponibilites[this.selectedDate]) {
      const bookings = DB.get('bookings');
      const bookedSlots = bookings.filter(b => b.coachId === coach.id && b.date === this.selectedDate && b.statut !== 'annule').map(b => b.heure);
      slotsHtml = `
        <div class="slots-wrap">
          ${coach.disponibilites[this.selectedDate].map(s => {
            const isBooked = bookedSlots.includes(s);
            const isActive = this.selectedSlot === s;
            return `<button class="slot-btn ${isBooked ? 'booked' : ''} ${isActive ? 'active' : ''}"
              onclick="${isBooked ? '' : `App.selectedSlot='${s}';App.render()`}">${s}</button>`;
          }).join('')}
        </div>`;
    }

    const reviewsHtml = reviews.length
      ? reviews.map(r => `
          <div class="review-card">
            <div class="review-header">
              ${avatarHtml(r.auteur.substring(0,2).toUpperCase(), 'linear-gradient(135deg,#1e40af,#60a5fa)', 'sm')}
              <div class="review-meta">
                <div class="review-author">${r.auteur}</div>
                <div class="review-date">${new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>
              </div>
              ${starsHtml(r.note, true)}
            </div>
            <div class="review-text">${r.commentaire}</div>
          </div>`).join('')
      : `<div style="color:var(--muted);font-size:14px;padding:20px 0">Aucun avis pour le moment.</div>`;

    const canBook = Auth.currentUser && Auth.currentUser.role === 'user';
    const bookBtn = canBook
      ? `<button class="btn btn-primary" onclick="App.go('booking',{selectedCoach:'${coach.id}',selectedDate:App.selectedDate,selectedSlot:App.selectedSlot,bookingStep:1})"
           ${!(this.selectedDate && this.selectedSlot) ? 'disabled' : ''}>
           📅 ${this.selectedDate && this.selectedSlot ? `Réserver ${this.selectedSlot}` : 'Choisissez un créneau'}
         </button>`
      : !Auth.currentUser
        ? `<button class="btn btn-primary" onclick="App.go('login')">🔐 Connexion pour réserver</button>`
        : '';

    return `
      <div class="profile-header">
        <div class="container">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
            <button class="btn btn-secondary btn-sm" onclick="App.go('search')">← Retour</button>
            <button class="btn btn-secondary btn-sm" onclick="App.shareCoach('${coach.id}','${coach.nom}')">🔗 Partager</button>
          </div>
          <div class="profile-main">
            ${avatarHtml(coach.initiales, coach.avatarColor, 'lg', coach.avatarUrl || null)}
            <div class="profile-info">
              <div class="profile-name">${coach.nom}</div>
              ${(coach.plan||'decouverte')==='essentiel' ? `<span style="display:inline-block;font-size:11px;background:#c9a84c;color:white;padding:3px 8px;border-radius:10px;font-weight:700;margin-top:4px">⭐ Coach Essentiel</span>` : ''}
              <div style="color:#2cc4a8;font-size:14px;margin-top:4px">${coach.specialite}</div>
              <div style="color:var(--muted);font-size:13px;margin-top:3px">📍 ${coach.ville} · ${coach.experience} ans d'expérience</div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
                ${starsHtml(coach.rating)}
                <span style="font-size:14px;font-weight:700">${coach.rating || '–'}</span>
                <span style="color:var(--muted);font-size:13px">(${coach.nbAvis} avis)</span>
                <span style="color:var(--muted);font-size:13px">·</span>
                <span style="color:var(--muted);font-size:13px">${coach.nbEleves} élèves</span>
              </div>
              <div class="profile-tags">
                ${coach.niveaux.map(n => `<span class="badge badge-green">${n}</span>`).join('')}
                ${coach.langues.map(l => `<span class="badge badge-blue">${l}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="container" style="padding-bottom:60px">
        <!-- Bio -->
        <div class="card" style="margin-top:24px">
          <div class="title-md" style="margin-bottom:12px">À propos</div>
          <p class="profile-bio">${coach.bio}</p>
        </div>

        <!-- Tarifs -->
        <div class="card" style="margin-top:16px">
          <div class="title-md" style="margin-bottom:16px">Tarifs</div>
          ${tarifsHtml}
        </div>

        <!-- Diplômes -->
        <div class="card" style="margin-top:16px">
          <div class="title-md" style="margin-bottom:12px">Diplômes & Certifications</div>
          ${diplomesList}
        </div>

        <!-- Calendrier de réservation -->
        <div class="card" style="margin-top:16px">
          <div class="title-md" style="margin-bottom:16px">Disponibilités</div>
          ${dates.length
            ? `<div class="days-scroll">${calDays}</div>${slotsHtml}`
            : `<div style="color:var(--muted);font-size:14px">Aucune disponibilité pour le moment.</div>`}
          <div style="margin-top:20px">${bookBtn}</div>
        </div>

        <!-- Avis -->
        <div class="card" style="margin-top:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div class="title-md">Avis (${reviews.length})</div>
            ${starsHtml(coach.rating)} <span style="font-size:15px;font-weight:700">${coach.rating}</span>
          </div>
          ${reviewsHtml}
        </div>
      </div>`;
  },

  // ===========================================================
  // VUE 3 — BOOKING FLOW
  // ===========================================================
  viewBooking() {
    if (!Auth.currentUser) { App.go('login'); return ''; }
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === this.selectedCoach);
    if (!coach) return '';

    const labelMap = { solo: 'Cours individuel', duo: 'Cours duo', trio: 'Cours trio', collectif: 'Cours collectif' };
    const prixMap = { solo: coach.tarifs?.solo, duo: coach.tarifs?.duo, trio: coach.tarifs?.trio, collectif: coach.tarifs?.collectif };

    const steps = ['Formule', 'Créneau', 'Confirmation'];
    const progressHtml = `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:28px">
        ${steps.map((s, i) => `
          <div style="height:3px;flex:1;border-radius:2px;background:${i < this.bookingStep ? '#2cc4a8' : 'var(--border)'}"></div>
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:${i < this.bookingStep ? '#2cc4a8' : 'var(--muted)'};">${s}</span>`).join('')}
      </div>`;
    const nbP = { solo:1, duo:2, trio:3, collectif:4 };
    const floatingBar = this.bookingStep <= 3 ? `
      <div style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,0.15)">
        <div style="display:flex;align-items:center;gap:10px">
          ${avatarHtml(coach.initiales, coach.avatarColor, 'sm', coach.avatarUrl||null)}
          <div>
            <div style="font-weight:700;font-size:13px">${coach.nom}</div>
            <div style="font-size:11px;color:var(--muted)">${labelMap[this.selectedService]}${this.selectedDate ? ' · '+this.selectedDate : ''}${this.selectedSlot ? ' à '+this.selectedSlot : ''}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:Fraunces,serif;font-size:18px;font-weight:700;color:#2cc4a8">${prixMap[this.selectedService]}€<span style="font-size:11px;color:var(--muted)">/pers.</span></div>
          ${(nbP[this.selectedService]||1)>1 ? `<div style="font-size:10px;color:var(--muted)">Total ${(prixMap[this.selectedService]||0)*(nbP[this.selectedService]||1)}€</div>` : ''}
        </div>
      </div>` : '';

    // ÉTAPE 1 : Choix de la formule
    if (this.bookingStep === 1) {
      const services = [
        { key: 'solo', label: 'Cours individuel', desc: 'Vous seul avec le coach · 1 personne', icon: '🎯', prix: coach.tarifs.solo, nb: 1 },
        { key: 'duo', label: 'Cours duo', desc: 'Vous + 1 ami · 2 personnes', icon: '👥', prix: coach.tarifs.duo, nb: 2 },
        { key: 'trio', label: 'Cours trio', desc: 'Vous + 2 amis · 3 personnes', icon: '🏆', prix: coach.tarifs.trio, nb: 3 },
        { key: 'collectif', label: 'Cours collectif', desc: 'Groupe de 4 joueurs max', icon: '🌟', prix: coach.tarifs.collectif, nb: 4 },
      ];
      const nextStep = (this.selectedDate && this.selectedSlot) ? 3 : 2;
      return `
        <div class="container-sm" style="padding-top:32px;padding-bottom:60px">
          ${progressHtml}
          <div class="title-lg" style="margin-bottom:6px">Combien de joueurs ?</div>
          <p style="color:var(--muted);font-size:13px;margin-bottom:24px">Cours avec ${coach.nom} · 60 min${this.selectedDate && this.selectedSlot ? ` · ${this.selectedDate} à ${this.selectedSlot}` : ''}</p>
          ${services.map(s => `
            <div class="coach-card ${this.selectedService===s.key ? 'card-green' : ''}"
              style="margin-bottom:10px;display:flex;align-items:center;gap:14px"
              onclick="App.selectedService='${s.key}';App.render()">
              <span style="font-size:26px">${s.icon}</span>
              <div style="flex:1"><div style="font-weight:700">${s.label}</div><div style="font-size:12px;color:var(--muted)">${s.desc}</div>${s.nb > 1 ? `<div style="font-size:11px;color:#2cc4a8;font-weight:600;margin-top:2px">Total ${s.prix * s.nb}€ pour ${s.nb} joueurs</div>` : ''}</div>
              <div style="text-align:right">
                <div style="font-family:Fraunces,serif;font-size:22px;font-weight:700;color:#2cc4a8">${s.prix}€</div>
                <div style="font-size:11px;color:var(--muted)">/pers.</div>
              </div>
            </div>`).join('')}
          <div style="display:flex;gap:10px;margin-top:20px">
            <button class="btn btn-secondary" onclick="App.go('profile',{selectedCoach:'${coach.id}'})">← Retour</button>
            <button class="btn btn-primary" style="flex:1" onclick="App.bookingStep=${nextStep};App.render()">Continuer →</button>
          </div>
        </div>${floatingBar}`;
    }

    // ÉTAPE 2 : Choix du créneau
    if (this.bookingStep === 2) {
      const todayDate = (() => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
      const dates = Object.keys(coach.disponibilites).sort().filter(d => d >= todayDate).slice(0, 14);
      const calDays = dates.map(d => {
        const isActive = this.selectedDate === d;
        return `<div class="day-btn ${isActive ? 'active' : ''}" onclick="App.selectedDate='${d}';App.selectedSlot=null;App.render()">
          <div class="day-name">${new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div>
          <div class="day-num">${new Date(d+'T00:00:00').getDate()}</div>
          <div class="day-name">${['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'][new Date(d+'T00:00:00').getMonth()]}</div>
        </div>`;
      }).join('');
      let slotsHtml = '';
      if (this.selectedDate && coach.disponibilites[this.selectedDate]) {
        const bookings = DB.get('bookings');
        const bookedSlots = bookings.filter(b => b.coachId===coach.id && b.date===this.selectedDate && b.statut!=='annule').map(b=>b.heure);
        slotsHtml = `<div class="slots-wrap">${[...coach.disponibilites[this.selectedDate]].sort().map(s => {
          const booked = bookedSlots.includes(s);
          const active = this.selectedSlot === s;
          return `<button class="slot-btn ${booked?'booked':''} ${active?'active':''}" onclick="${booked?'':` App.selectedSlot='${s}';App.render()`}">${s}</button>`;
        }).join('')}</div>`;
      }
      return `
        <div class="container-sm" style="padding-top:32px;padding-bottom:60px">
          ${progressHtml}
          <div class="title-lg" style="margin-bottom:6px">Choisissez un créneau</div>
          <p style="color:var(--muted);font-size:13px;margin-bottom:20px">${{solo:'Cours particulier',duo:'Cours duo',trio:'Cours trio',collectif:'Cours collectif'}[this.selectedService]} · 60 min</p>
          <div class="days-scroll">${calDays || '<span style="color:var(--muted)">Aucune disponibilité</span>'}</div>
          ${this.selectedDate ? slotsHtml : '<p style="color:var(--muted);font-size:14px;padding:20px 0;text-align:center">👆 Sélectionnez un jour</p>'}
          <div style="display:flex;gap:10px;margin-top:24px">
            <button class="btn btn-secondary" onclick="App.bookingStep=1;App.render()">← Retour</button>
            <button class="btn btn-primary" style="flex:1"
              onclick="App.bookingStep=3;App.render()"
              ${!(this.selectedDate && this.selectedSlot) ? 'disabled' : ''}>
              Continuer →
            </button>
          </div>
        </div>${floatingBar}`;
    }

    // ÉTAPE 3 : Confirmation
    if (this.bookingStep === 3) {
      return `
        <div class="container-sm" style="padding-top:32px;padding-bottom:60px">
          ${progressHtml}
          <div class="title-lg" style="margin-bottom:6px">Confirmation</div>
          <p style="color:var(--muted);font-size:13px;margin-bottom:24px">Vérifiez votre réservation</p>
          <div class="card card-green" style="margin-bottom:20px">
            <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
              ${avatarHtml(coach.initiales, coach.avatarColor, 'md', coach.avatarUrl || null)}
              <div>
                <div style="font-weight:700">${coach.nom}</div>
                <div style="color:#2cc4a8;font-size:13px">${coach.specialite}</div>
              </div>
            </div>
            ${[
              ['Formule', labelMap[this.selectedService]],
              ['Date', formatDate(this.selectedDate)],
              ['Heure', this.selectedSlot + ' (60 min)'],
              ['Lieu', coach.ville],
            ].map(([k,v]) => `
              <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
                <span style="color:var(--muted);font-size:13px">${k}</span>
                <span style="font-weight:600;font-size:13px">${v}</span>
              </div>`).join('')}
            <div style="display:flex;justify-content:space-between;padding-top:14px;margin-top:4px">
              <span style="font-weight:700">Total</span>
              <span style="font-family:Fraunces,serif;font-size:22px;font-weight:700;color:#2cc4a8">${prixMap[this.selectedService]}€</span>
            </div>
          </div>
          <div class="card" style="background:rgba(251,146,60,0.08);border-color:rgba(251,146,60,0.2);margin-bottom:20px">
            <p style="font-size:13px;color:var(--muted2);line-height:1.6">💡 <strong>Paiement sur place.</strong> Pas de prélèvement en ligne. Annulation gratuite jusqu'à 24h avant le cours.</p>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-secondary" onclick="App.bookingStep=2;App.render()">← Retour</button>
            <button class="btn btn-primary" style="flex:1" onclick="App.confirmBooking()">✓ Confirmer la réservation</button>
          </div>
        </div>${floatingBar}`;
    }

    // ÉTAPE 4 : Succès
    return `
      <div class="container-sm" style="padding-top:60px;padding-bottom:60px;text-align:center">
        <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a2e28,#2cc4a8);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px;box-shadow:0 0 40px rgba(44,196,168,0.35)">✓</div>
        <div class="title-lg" style="margin-bottom:8px">Réservation confirmée !</div>
        <p style="color:var(--muted);font-size:14px;margin-bottom:28px">Votre réservation a été envoyée à ${coach.nom}</p>
        <!-- Bouton Google Calendar élève -->
        ${(() => {
          const gcalUrl = makeGCalLink({
            title: `Cours de Padel — ${labelMap[this.selectedService]} avec ${coach.nom}`,
            date: this.selectedDate,
            heure: this.selectedSlot,
            duree: 60,
            lieu: coach.ville + ' — ' + coach.specialite,
            description: `Cours de padel avec ${coach.nom} (${coach.specialite}). Formule : ${labelMap[this.selectedService]}. Tarif : ${prixMap[this.selectedService]}€/pers. Paiement sur place.`,
          });
          return `<a href="${gcalUrl}" target="_blank" class="btn btn-primary btn-full" style="margin-bottom:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px">
            <span>📅</span> Ajouter à Google Calendar
          </a>`;
        })()}
        <div class="card" style="background:rgba(44,196,168,0.08);border-color:rgba(44,196,168,0.2);margin-bottom:20px;text-align:left">
          <p style="font-size:13px;color:var(--muted2);line-height:1.6">
            🔔 <strong>${coach.nom} a été notifié</strong> de votre demande. Vous recevrez une confirmation dès qu'il accepte le créneau.
          </p>
        </div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-secondary" onclick="App.go('user-dashboard')">Mes réservations</button>
          <button class="btn btn-secondary" onclick="App.go('search')">Retour à l'accueil</button>
        </div>
      </div>`;
  },

  async confirmBooking() {
    const { data: { user: authUser } } = await sb.auth.getUser();
    const userEmail = authUser?.email || '';
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === this.selectedCoach);
    const prixMap = { solo: coach.tarifs.solo, duo: coach.tarifs.duo, trio: coach.tarifs.trio, collectif: coach.tarifs.collectif };
    const labelMap = { solo: 'Cours individuel', duo: 'Cours duo', trio: 'Cours trio', collectif: 'Cours collectif' };

    try {
      const booking = await DB.insert('bookings', {
        userId: Auth.currentUser.id,
        coachId: this.selectedCoach,
        coachNom: coach.nom,
        coachVille: coach.ville,
        userNom: `${Auth.currentUser.prenom} ${Auth.currentUser.nom}`,
        userEmail: userEmail,
        service: this.selectedService,
        serviceLabel: labelMap[this.selectedService],
        date: this.selectedDate,
        heure: this.selectedSlot,
        prix: prixMap[this.selectedService],
        statut: 'en_attente',
      });

      sendBrowserNotif(
        '🎾 Nouvelle réservation !',
        `${Auth.currentUser.prenom} ${Auth.currentUser.nom} a réservé un ${labelMap[this.selectedService]} le ${formatDate(this.selectedDate)} à ${this.selectedSlot}`
      );

      // Email 1 — confirmation au joueur
      sendEmail({
        to: userEmail,
        subject: '🎾 Réservation reçue — PadelBook',
        html: emailTemplate({
          title: 'Réservation envoyée !',
          body: `Bonjour <strong>${booking.userNom}</strong>,<br><br>
            Votre demande de réservation a bien été envoyée à <strong>${coach.nom}</strong>.<br><br>
            <table style="width:100%;border-collapse:collapse;margin:16px 0">
              <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Formule</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${booking.serviceLabel}</td></tr>
              <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Date</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${formatDate(booking.date)} à ${booking.heure}</td></tr>
              <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Coach</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${coach.nom}</td></tr>
              <tr><td style="padding:8px 0;color:#6b7280">Prix</td><td style="padding:8px 0;font-weight:600;color:#2cc4a8">${booking.prix}€/pers.</td></tr>
            </table>
            Vous recevrez un email dès que ${coach.nom} aura confirmé votre créneau. Paiement sur place.`
        })
      }).catch(() => {});

      // Email 2 — notification au coach
      sendEmail({
        to: coach.email || '',
        subject: '🎾 Nouvelle réservation — PadelBook',
        html: emailTemplate({
          title: 'Nouvelle réservation !',
          body: `Bonjour <strong>${coach.nom}</strong>,<br><br>
            <strong>${booking.userNom}</strong> vient de réserver un cours avec vous.<br><br>
            <table style="width:100%;border-collapse:collapse;margin:16px 0">
              <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Formule</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${booking.serviceLabel}</td></tr>
              <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Date</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${formatDate(booking.date)} à ${booking.heure}</td></tr>
              <tr><td style="padding:8px 0;color:#6b7280">Prix</td><td style="padding:8px 0;font-weight:600;color:#2cc4a8">${booking.prix}€/pers.</td></tr>
            </table>
            Connectez-vous sur PadelBook pour <strong>confirmer ou refuser</strong> cette réservation.`
        })
      }).catch(() => {});

      this.bookingStep = 4;
      this.render();
    } catch(e) {
      console.error('confirmBooking error:', e);
      toast(`❌ Erreur : ${e.message || 'Impossible de confirmer la réservation'}`, 'error');
    }
  },

  // ===========================================================
  // VUE 4 — TABLEAU DE BORD ÉLÈVE
  // ===========================================================
  viewUserDashboard() {
    if (!Auth.currentUser || Auth.currentUser.role !== 'user') { App.go('login'); return ''; }
    const user = Auth.currentUser;
    const bookings = DB.get('bookings').filter(b => b.userId === user.id).sort((a,b) => b.createdAt.localeCompare(a.createdAt));

    const myMessages = DB.get('messages').filter(m => m.userId === user.id).sort((a,b) => b.date.localeCompare(a.date));
    const unreadCount = myMessages.filter(m => !m.read).length;
    const favCoaches = DB.get('coaches').filter(c => (user.favoris||[]).includes(c.id));
    const tabs = ['bookings', 'favoris', 'messages', 'reviews', 'profil'];
    const tabLabels = { bookings: '📅 Réservations', favoris: `❤️ Favoris${favCoaches.length>0?` (${favCoaches.length})`:''}`, messages: `💬 Messages${unreadCount>0?` <span style="background:#2cc4a8;color:white;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700">${unreadCount}</span>`:''}`, reviews: '⭐ Mes avis', profil: '👤 Mon profil' };

    const myReviewedBookings = new Set(DB.get('reviews').filter(r => r.userId === user.id).map(r => r.bookingId));
    const todayStr = new Date().toISOString().slice(0,10);
    const getNbP = b => {
      if ((b.service==='duo')||(b.serviceLabel||'').toLowerCase().includes('duo')) return 2;
      if ((b.service==='trio')||(b.serviceLabel||'').toLowerCase().includes('trio')) return 3;
      if ((b.service==='collectif')||(b.serviceLabel||'').toLowerCase().includes('collectif')) return 4;
      return 1;
    };
    const renderBooking = b => {
      const effectue = b.statut === 'confirme' && new Date(`${b.date}T${b.heure||'23:59'}`) < new Date();
      const statusMap = { en_attente: ['badge-orange','⏳ En attente'], confirme: ['badge-green','✅ Confirmé'], annule: ['badge-red','❌ Annulé'] };
      const [cls, label] = effectue ? ['badge-gray','✓ Effectué'] : (statusMap[b.statut] || ['badge-gray','–']);
      const alreadyReviewed = myReviewedBookings.has(b.id);
      const nb = getNbP(b);
      const prixTotal = (b.prix||0) * nb;
      const prixLabel = nb > 1 ? `${b.prix}€/pers. · Total ${prixTotal}€` : `${b.prix}€`;
      return `
        <div class="booking-item" style="${effectue?'opacity:0.6;':''}">
          ${avatarHtml((b.coachNom||'??').substring(0,2).toUpperCase(), effectue?'#9ca3af':'linear-gradient(135deg,#1a2e28,#2cc4a8)', 'sm')}
          <div class="booking-info">
            <div class="booking-name" style="${effectue?'color:#6b7280':''}">${b.coachNom}</div>
            <div class="booking-detail">${b.serviceLabel} · ${formatDate(b.date)} à ${b.heure}</div>
            <div class="booking-detail">${prixLabel} · Paiement sur place</div>
          </div>
          <div class="booking-actions">
            <span class="badge ${cls}">${label}</span>
            ${effectue && !alreadyReviewed ? `<button class="btn btn-secondary btn-sm" onclick="App.openReviewModal('${b.id}')">⭐ Avis</button>` : ''}
            ${effectue && alreadyReviewed ? `<span style="font-size:12px;color:var(--muted)">✅ Avis posté</span>` : ''}
            ${!effectue && (b.statut === 'en_attente' || b.statut === 'confirme') ? `<button class="btn btn-danger btn-sm" onclick="App.cancelBooking('${b.id}')">Annuler</button>` : ''}
          </div>
        </div>`;
    };
    const upcoming = bookings.filter(b => b.date >= todayStr && b.statut !== 'annule');
    const past = bookings.filter(b => b.date < todayStr && b.statut !== 'annule');
    const bookingsList = bookings.length ? `
      ${upcoming.length ? `<div style="font-size:13px;font-weight:700;color:#2cc4a8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">À venir</div>${upcoming.map(renderBooking).join('')}` : ''}
      ${past.length ? `<div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px">Passées</div>${past.map(renderBooking).join('')}` : ''}
    ` : `<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">Aucune réservation</div><button class="btn btn-primary" onclick="App.go('search')">Trouver un coach</button></div>`;

    const myReviews = DB.get('reviews').filter(r => r.userId === user.id);
    const coaches = DB.get('coaches');
    const reviewsList = myReviews.length
      ? myReviews.map(r => {
          const coachNom = coaches.find(c => c.id === r.coachId)?.nom || 'Coach';
          return `
          <div class="review-card">
            <div class="review-header">
              <div class="review-meta"><div class="review-author">${coachNom}</div><div class="review-date">${r.date}</div></div>
              ${starsHtml(r.note, true)}
            </div>
            ${r.commentaire ? `<div class="review-text">${r.commentaire}</div>` : ''}
          </div>`;
        }).join('')
      : `<div class="empty"><div class="empty-icon">⭐</div><div class="empty-title">Aucun avis posté</div></div>`;

    return `
      <div class="dashboard-header">
        <div class="container">
          <div style="display:flex;gap:16px;align-items:center">
            ${avatarHtml(user.initiales || ((user.prenom?.[0]||'')+(user.nom?.[0]||'')).toUpperCase(), user.avatarColor, 'lg', user.avatarUrl || null)}
            <div>
              <div class="title-lg">${[user.prenom,user.nom].filter(v=>v&&v!=='undefined').join(' ')}</div>
              <div style="color:var(--muted);font-size:13px">${user.email}</div>
              <span class="badge badge-blue" style="margin-top:6px">Élève</span>
            </div>
          </div>
        </div>
      </div>
      <div class="container" style="padding-top:24px;padding-bottom:60px">
        <div class="tabs">
          ${tabs.map(t => `<div class="tab ${this.dashTab===t?'active':''}" onclick="App.dashTab='${t}';App.render()">${tabLabels[t]}</div>`).join('')}
        </div>
        ${this.dashTab === 'bookings' ? bookingsList : this.dashTab === 'favoris' ? (favCoaches.length ? `<div class="coaches-list">${favCoaches.map((c,i)=>this.buildBlobCard(c,i%20)).join('')}</div>` : `<div class="empty"><div class="empty-icon">❤️</div><div class="empty-title">Aucun favori</div><p style="color:var(--muted);font-size:14px">Cliquez sur 🤍 sur une fiche coach pour l'ajouter</p><button class="btn btn-primary" onclick="App.go('search')">Trouver un coach</button></div>`) : this.dashTab === 'messages' ? (myMessages.length ? myMessages.map(m => {
          if (!m.read) DB.update('messages', m.id, { read: true });
          return `<div class="card" style="margin-bottom:10px;border-left:3px solid #2cc4a8">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <span style="font-weight:700;font-size:14px">🎾 ${m.coachNom}</span>
              <span style="font-size:11px;color:var(--muted)">${m.date}</span>
            </div>
            <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin:0;white-space:pre-line">${m.message}</p>
          </div>`;
        }).join('') : '<div class="empty"><div class="empty-icon">💬</div><div class="empty-title">Aucun message</div></div>')
        : this.dashTab === 'reviews' ? reviewsList : `
          <!-- PHOTO -->
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;background:var(--card);border-radius:16px;border:1px solid var(--border);margin-bottom:16px">
            ${avatarHtml(user.initiales || ((user.prenom?.[0]||'')+(user.nom?.[0]||'')).toUpperCase() || '?', user.avatarColor || 'linear-gradient(135deg,#1e40af,#60a5fa)', 'lg', user.avatarUrl || null)}
            <label style="cursor:pointer">
              <span class="btn btn-secondary btn-sm">📷 Changer la photo</span>
              <input type="file" accept="image/*" style="display:none" onchange="App.uploadAvatar(this)">
            </label>
            <p style="font-size:12px;color:var(--muted);margin:0">JPG ou PNG · max 4 Mo</p>
          </div>
          <!-- INFOS GÉNÉRALES -->
          <div style="font-size:13px;font-weight:700;color:#2cc4a8;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 12px">Informations générales</div>
          <div class="input-group"><label>Prénom</label><input class="input-field" id="u-prenom" value="${user.prenom||''}" placeholder="Votre prénom"></div>
          <div class="input-group"><label>Nom</label><input class="input-field" id="u-nom" value="${user.nom||''}" placeholder="Votre nom"></div>
          <div class="input-group"><label>Âge</label><input class="input-field" type="number" id="u-age" value="${user.age||''}" placeholder="Ex: 32" min="10" max="99"></div>
          <div class="input-group"><label>Ville</label><input class="input-field" id="u-ville" value="${user.ville||''}" placeholder="Ex: Lyon"></div>
          <div class="input-group"><label>Téléphone <span style="font-weight:400;color:var(--muted)">(visible uniquement par votre coach)</span></label><input class="input-field" type="tel" id="u-tel" value="${user.telephone||''}" placeholder="Ex: 06 12 34 56 78"></div>

          <!-- NIVEAU -->
          <div style="font-size:13px;font-weight:700;color:#2cc4a8;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 12px">Niveau & pratique</div>
          <div class="input-group">
            <label>Classement FFT <span style="font-weight:400;color:var(--muted)">(votre numéro de classement)</span></label>
            <input class="input-field" type="number" id="u-classement" value="${user.classement||''}" placeholder="Ex: 1250" min="0">
          </div>
          <div class="input-group">
            <label>Niveau de jeu</label>
            <select class="input-field" id="u-niveau">
              ${['','Débutant','Intermédiaire','Avancé','Compétiteur'].map(v => `<option value="${v}" ${(user.niveau||'')===v?'selected':''}>${v||'Non renseigné'}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>Côté favori</label>
            <select class="input-field" id="u-cote">
              ${['','Droite','Gauche','Les deux'].map(v => `<option value="${v}" ${(user.cote||'')===v?'selected':''}>${v||'Non renseigné'}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>Fréquence de jeu</label>
            <select class="input-field" id="u-frequence">
              ${['','1 fois par semaine','2-3 fois par semaine','Tous les jours','Occasionnel'].map(v => `<option value="${v}" ${(user.frequence||'')===v?'selected':''}>${v||'Non renseigné'}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>Disponibilités générales</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
              ${['Matins','Après-midis','Soirs','Week-end'].map(d => {
                const dispos = user.dispos || [];
                const checked = dispos.includes(d);
                return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:20px;background:${checked?'rgba(44,196,168,0.15)':'var(--card)'};border:1px solid ${checked?'#2cc4a8':'var(--border)'}"><input type="checkbox" ${checked?'checked':''} data-dispo="${d}" style="accent-color:#2cc4a8"> ${d}</label>`;
              }).join('')}
            </div>
          </div>

          <!-- OBJECTIFS -->
          <div style="font-size:13px;font-weight:700;color:#2cc4a8;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 12px">Objectifs</div>
          <div class="input-group">
            <label>Objectif principal</label>
            <select class="input-field" id="u-objectif">
              ${['','Progresser en loisir','Atteindre le niveau compétition','Préparer un tournoi','Reprendre le sport','Découvrir le padel'].map(v => `<option value="${v}" ${(user.objectif||'')===v?'selected':''}>${v||'Non renseigné'}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>🏆 Palmarès</label>
            <textarea class="input-field" id="u-palmares" rows="3" placeholder="Ex: Vainqueur P25 Lyon 2024, demi-finale Open Bordeaux…">${user.palmares||''}</textarea>
          </div>

          <!-- PARTENAIRE -->
          <div style="font-size:13px;font-weight:700;color:#2cc4a8;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 12px">Recherche partenaire</div>
          <div class="input-group">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
              <input type="checkbox" id="u-cherche-partenaire" ${user.cherchePartenaire?'checked':''} style="accent-color:#2cc4a8;width:18px;height:18px">
              <span>Je cherche un partenaire d'entraînement</span>
            </label>
          </div>
          <div class="input-group">
            <label>Niveau souhaité du partenaire</label>
            <select class="input-field" id="u-niveau-partenaire">
              ${['','Même niveau que moi','Débutant','Intermédiaire','Avancé','Compétiteur','Peu importe'].map(v => `<option value="${v}" ${(user.niveauPartenaire||'')===v?'selected':''}>${v||'Non renseigné'}</option>`).join('')}
            </select>
          </div>

          <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="App.saveUserProfile()">💾 Enregistrer le profil</button>`}
      </div>`;
  },

  _reviewBookingId: null,
  _reviewCoachId: null,
  _reviewNote: 0,

  openReviewModal(bookingId) {
    const booking = DB.get('bookings').find(b => b.id === bookingId);
    if (!booking) { toast('❌ Réservation introuvable'); return; }
    this._reviewBookingId = bookingId;
    this._reviewCoachId = booking.coachId;
    this._reviewNote = 0;
    document.getElementById('review-coach-name').textContent = booking.coachNom || 'Coach';
    document.getElementById('review-text').value = '';
    [1,2,3,4,5].forEach(n => document.getElementById('star-'+n).style.opacity = '0.3');
    document.getElementById('review-modal').style.display = 'flex';
  },

  closeReviewModal() {
    document.getElementById('review-modal').style.display = 'none';
  },

  setReviewNote(n) {
    this._reviewNote = n;
    [1,2,3,4,5].forEach(i => document.getElementById('star-'+i).style.opacity = i <= n ? '1' : '0.3');
  },

  async submitReview() {
    if (!this._reviewNote) { toast('❌ Choisissez une note'); return; }
    const commentaire = document.getElementById('review-text').value.trim();
    const user = Auth.currentUser;
    try {
      await DB.insert('reviews', {
        userId: user.id,
        coachId: this._reviewCoachId,
        bookingId: this._reviewBookingId,
        auteur: `${user.prenom || ''} ${user.nom || ''}`.trim(),
        note: this._reviewNote,
        commentaire,
        date: new Date().toISOString().slice(0,10),
        modere: true,
      });
      // Mettre à jour la note moyenne du coach
      const reviews = DB.get('reviews').filter(r => r.coachId === this._reviewCoachId);
      const avg = (reviews.reduce((s,r) => s + r.note, 0) / reviews.length).toFixed(1);
      DB.update('coaches', this._reviewCoachId, { rating: parseFloat(avg) });
      this.closeReviewModal();
      toast('✅ Avis publié, merci !');
      this.render();
    } catch(e) {
      toast('❌ Erreur : ' + e.message);
    }
  },

  async cancelBooking(id) {
    if (!confirm('Annuler cette réservation ?')) return;
    const booking = DB.get('bookings').find(b => b.id === id);
    await DB.update('bookings', id, { statut: 'annule' });
    toast('Réservation annulée');
    // Email au coach
    if (booking) {
      const coach = DB.get('coaches').find(c => c.id === booking.coachId);
      const user = Auth.currentUser;
      if (coach?.email) {
        sendEmail({
          to: coach.email,
          subject: '❌ Annulation de réservation — PadelBook',
          html: emailTemplate({
            title: `Annulation de réservation`,
            body: `Bonjour ${coach.nom},<br><br>Le joueur <strong>${user.prenom} ${user.nom}</strong> a annulé sa réservation :<br><br>📅 <strong>${booking.date}</strong> à <strong>${booking.heure}</strong> — ${booking.serviceLabel || booking.service}`
          })
        }).catch(() => {});
      }
    }
    this.render();
  },

  // ===========================================================
  // VUE 5 — TABLEAU DE BORD COACH
  // ===========================================================
  viewCoachDashboard() {
    if (!Auth.currentUser || Auth.currentUser.role !== 'coach') { App.go('login'); return ''; }
    const user = Auth.currentUser;
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === user.coachId);
    if (!coach) return `<div class="empty"><div class="empty-title">Profil coach introuvable</div></div>`;

    const bookings = DB.get('bookings').filter(b => b.coachId === coach.id && b.statut !== 'annule').sort((a,b) => b.createdAt.localeCompare(a.createdAt));
    const pending = bookings.filter(b => b.statut === 'en_attente');
    const isPlanPaid = (coach.plan||'decouverte') !== 'decouverte';
    const tabs = ['stats', 'bookings', 'avis', 'dispos', 'profil', 'tarifs', 'abonnement'];
    const tabLabels = { stats: '📊 Tableau de bord', bookings: `📅 Réservations ${pending.length?`(${pending.length})`:''}`, avis: `⭐ Avis${!isPlanPaid?' 🔒':''}`, dispos: '📆 Disponibilités', profil: '👤 Mon profil', tarifs: '💰 Tarifs', abonnement: '💳 Abonnement' };
    if (!this.dashTab || this.dashTab === 'home') this.dashTab = 'stats';

    let content = '';

    if (this.dashTab === 'stats') {
      const now = new Date();
      const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      const getNbPersonnes = b => {
        if (b.service === 'duo' || (b.serviceLabel||'').toLowerCase().includes('duo')) return 2;
        if (b.service === 'trio' || (b.serviceLabel||'').toLowerCase().includes('trio')) return 3;
        if (b.service === 'collectif' || (b.serviceLabel||'').toLowerCase().includes('collectif')) return 4;
        return 1;
      };
      const confirmedAll = bookings.filter(b => b.statut === 'confirme');
      const confirmedMonth = confirmedAll.filter(b => (b.date||'').startsWith(monthStr));
      const revenuMois = confirmedMonth.reduce((s,b) => s + (b.prix||0) * getNbPersonnes(b), 0);
      const revenuTotal = confirmedAll.reduce((s,b) => s + (b.prix||0) * getNbPersonnes(b), 0);
      const reviews = DB.get('reviews').filter(r => r.coachId === coach.id);
      const avgNote = reviews.length ? (reviews.reduce((s,r) => s+r.note, 0) / reviews.length).toFixed(1) : null;
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const upcoming = confirmedAll.filter(b => b.date >= todayStr).sort((a,b) => a.date.localeCompare(b.date) || a.heure.localeCompare(b.heure)).slice(0, 5);
      const past = confirmedAll.filter(b => b.date < todayStr).sort((a,b) => b.date.localeCompare(a.date) || b.heure.localeCompare(a.heure)).slice(0, 5);

      const isPaid = isPlanPaid;
      const statCard = (icon, label, value, sub, tab) => `
        <div onclick="${tab ? `App.dashTab='${tab}';App.render()` : ''}" style="background:white;border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);flex:1;min-width:140px;${tab?'cursor:pointer;':''}position:relative">
          <div style="font-size:26px;margin-bottom:6px">${icon}</div>
          <div style="font-size:26px;font-weight:800;color:#0d2a22">${value}</div>
          <div style="font-size:13px;font-weight:600;color:#374151;margin-top:2px">${label}</div>
          ${sub ? `<div style="font-size:11px;color:#9ca3af;margin-top:2px">${sub}</div>` : ''}
          ${tab && !isPaid ? `<div style="position:absolute;top:10px;right:10px;font-size:14px">🔒</div>` : ''}
          ${tab ? `<div style="font-size:11px;color:#2cc4a8;margin-top:6px;font-weight:600">Voir le détail →</div>` : ''}
        </div>`;

      content = `
        <div style="padding:8px 0 20px">
          <div style="font-size:18px;font-weight:800;color:#0d2a22;margin-bottom:16px">Bonjour ${coach.nom} 👋</div>
          ${(coach.plan||'decouverte')==='decouverte' ? `
          <div onclick="App.dashTab='abonnement';App.render()" style="cursor:pointer;background:linear-gradient(135deg,#7c5c0a,#d4a843);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px">
            <span style="font-size:28px">⭐</span>
            <div style="flex:1">
              <div style="font-weight:800;color:white;font-size:15px">Passez à la formule Essentiel</div>
              <div style="color:rgba(255,255,255,0.8);font-size:13px;margin-top:2px">Réservations illimitées · Profil complet · 9€/mois</div>
            </div>
            <div style="color:white;font-size:20px">→</div>
          </div>` : `
          <div style="background:linear-gradient(135deg,#f0fdf9,#e8faf7);border:1px solid #2cc4a844;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px">
            <span style="font-size:24px">🔗</span>
            <div style="flex:1">
              <div style="font-weight:700;color:#0d2a22;font-size:14px">Partagez votre profil</div>
              <div style="color:#6b7280;font-size:12px;margin-top:2px">Instagram, WhatsApp, SMS — attirez de nouveaux élèves</div>
            </div>
            <button onclick="App.shareCoach('${coach.id}','${coach.nom}')" style="background:#2cc4a8;color:white;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">Partager →</button>
          </div>`}
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px">
            ${statCard('💰', 'Revenu ce mois', revenuMois + '€', 'cours confirmés', 'bookings')}
            ${statCard('📅', 'Réservations confirmées', confirmedAll.length, 'total', 'bookings')}
            ${statCard('⭐', 'Note moyenne', avgNote ? avgNote + '/5' : '–', reviews.length ? reviews.length + ' avis' : 'aucun avis', 'avis')}
            ${statCard('🔔', 'En attente', pending.length, 'à confirmer', 'bookings')}
          </div>

          <div style="font-size:15px;font-weight:700;color:#0d2a22;margin-bottom:12px">Prochains cours</div>
          ${upcoming.length ? upcoming.map(b => `
            <div style="background:white;border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;align-items:center;gap:12px">
              <div style="background:linear-gradient(135deg,#5be0c8,#2cc4a8);color:white;border-radius:10px;padding:8px 12px;text-align:center;min-width:48px">
                <div style="font-size:11px;font-weight:700">${formatDate(b.date).split(' ')[0]}</div>
                <div style="font-size:16px;font-weight:800">${formatDate(b.date).split(' ')[1]||''}</div>
              </div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:14px;color:#0d2a22">${b.userNom||'Joueur'}</div>
