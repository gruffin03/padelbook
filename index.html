              <span style="font-size:28px">${plan.badge}</span>
              <div style="flex:1">
                <div style="font-weight:700">${plan.label}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px">${key==='decouverte'?'30 jours gratuits · 5 réservations max':'Réservations illimitées · Stats · Priorité recherche · Badge ⭐'}</div>
              </div>
              <div style="text-align:right">
                <div style="font-family:Fraunces,serif;font-size:22px;font-weight:700;color:#2cc4a8">${plan.price===0?'Gratuit':plan.price+'€'}</div>
                ${plan.price>0?'<div style="font-size:11px;color:var(--muted)">/mois</div>':''}
              </div>
              ${currentPlan===key?'<span class="badge badge-green">✓ Actuel</span>':''}
            </div>`).join('')}
        </div>
        <div class="card" style="margin-top:20px;background:rgba(44,196,168,0.06);border-color:rgba(44,196,168,0.2)">

    }

    const getNbPersonnes = b => {
      if (b.service === 'duo' || (b.serviceLabel||'').toLowerCase().includes('duo')) return 2;
      if (b.service === 'trio' || (b.serviceLabel||'').toLowerCase().includes('trio')) return 3;
      if (b.service === 'collectif' || (b.serviceLabel||'').toLowerCase().includes('collectif')) return 4;
      return 1;
    };
    const confirmedB = bookings.filter(b=>b.statut==='confirme');
    const totalRevenu = confirmedB.reduce((s,b) => s + (b.prix||0) * getNbPersonnes(b), 0);

    return `
      <div class="dashboard-header">
        <div class="container">

                <span class="badge badge-blue">💰 ${totalRevenu}€ générés</span>
                ${(coach.plan||'decouverte')==='decouverte' ? `<span class="badge badge-orange" style="cursor:pointer" onclick="App.dashTab='abonnement';App.render()">🆓 Formule Découverte — Passer à Essentiel →</span>` : ''}

  updateBooking(id, statut) {
    DB.update('bookings', id, { statut });
    if (statut === 'confirme') {
      const b = DB.get('bookings').find(x => x.id === id);
      if (b) {
        const coaches = DB.get('coaches');
        const coach = coaches.find(c => c.id === b.coachId);
        // Message interne
        const msg = `Votre cours de padel avec ${coach?.nom||'votre coach'} est confirmé 🎾\nRendez-vous le ${formatDate(b.date)} à ${b.heure} — ${b.serviceLabel||'cours'}.\nPaiement sur place. À bientôt !`;
        DB.insert('messages', { userId: b.userId, coachNom: coach?.nom||'Coach', message: msg, date: new Date().toISOString().slice(0,10), bookingId: id, read: false });
        // Email 3 — confirmation au joueur
        sendEmail({
          to: b.userEmail || '',
          subject: '✅ Cours confirmé — PadelBook',
          html: emailTemplate({
            title: 'Votre cours est confirmé !',
            body: `Bonjour <strong>${b.userNom}</strong>,<br><br>
              <strong>${coach?.nom||'Votre coach'}</strong> a confirmé votre réservation. 🎾<br><br>
              <table style="width:100%;border-collapse:collapse;margin:16px 0">
                <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Formule</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${b.serviceLabel}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Date</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${formatDate(b.date)} à ${b.heure}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #e5e7eb">Coach</td><td style="padding:8px 0;font-weight:600;border-bottom:1px solid #e5e7eb">${coach?.nom||'–'}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280">Prix</td><td style="padding:8px 0;font-weight:600;color:#2cc4a8">${b.prix}€/pers.</td></tr>
              </table>
              Paiement sur place le jour du cours. À bientôt sur le court !`
          })
        }).catch(() => {});
      }
    }
    toast(statut === 'confirme' ? '✅ Réservation confirmée' : '❌ Réservation refusée');
    this.render();
  },

  cancelBookingCoach(id) {
    if (!confirm('Annuler cette réservation confirmée ?')) return;
    DB.update('bookings', id, { statut: 'annule' });
    toast('Réservation annulée');
    this.render();
  },

  toggleFavori(coachId) {
    const user = Auth.currentUser;
    if (!user) { this.go('login'); return; }
    const favs = [...(user.favoris || [])];
    const idx = favs.indexOf(coachId);
    if (idx === -1) favs.push(coachId); else favs.splice(idx, 1);
    user.favoris = favs;
    DB.update('profiles', user.id, { favoris: favs });
    toast(idx === -1 ? '❤️ Ajouté aux favoris' : 'Retiré des favoris');
    this.render();
  },

  isFavori(coachId) {
    return (Auth.currentUser?.favoris || []).includes(coachId);
  },

  shareCoach(coachId, coachNom) {
    const url = `${window.location.origin}/coach/${coachId}`;
    if (navigator.share) {
      navigator.share({ title: coachNom + ' — PadelBook', text: 'Réserve un cours avec ' + coachNom + ' sur PadelBook', url });
    } else {
      navigator.clipboard.writeText(url).then(() => toast('🔗 Lien copié !'));
    }
  },

  setDispoClub(date, club) {
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === Auth.currentUser.coachId);
    if (!coach) return;
    const disposClubs = { ...(coach.disposClubs || {}), [date]: club };
    DB.update('coaches', coach.id, { disposClubs });
    toast('🏟️ Club enregistré');
  },

  toggleSlot(date, slot, checked) {
    const user = Auth.currentUser;
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === user.coachId);
    if (!coach) return;
    const dispos = { ...coach.disponibilites };
    const slots = [...(dispos[date] || [])];
    if (checked && !slots.includes(slot)) slots.push(slot);
    if (!checked) { const i = slots.indexOf(slot); if (i !== -1) slots.splice(i, 1); }
    slots.sort();
    if (slots.length) dispos[date] = slots;
    else delete dispos[date];
    DB.update('coaches', coach.id, { disponibilites: dispos });
    toast('Disponibilité mise à jour');
    // Pas de re-render complet pour garder la fluidité des checkboxes
  },

  _editingClubs: null,

  _clubAdd() {
    const coaches = DB.get('coaches');
    const coach = coaches.find(c => c.id === Auth.currentUser.coachId);
    if (!coach) return;
    if (!this._editingClubs) this._editingClubs = [...(coach.clubs || [])];
    this._editingClubs.push({ nom: '', adresse: '' });
    this.render();
  },

  _clubRemove(i) {
    if (!this._editingClubs) {
      const coaches = DB.get('coaches');
      const coach = coaches.find(c => c.id === Auth.currentUser.coachId);
      this._editingClubs = [...(coach.clubs || [])];
    }
    this._editingClubs.splice(i, 1);
    this.render();
  },

  _clubEdit(i, field, val) {
    if (!this._editingClubs) {
      const coaches = DB.get('coaches');
      const coach = coaches.find(c => c.id === Auth.currentUser.coachId);
      this._editingClubs = [...(coach.clubs || [])];
    }
    this._editingClubs[i][field] = val;
  },

  saveUserProfile() {
    const prenom           = document.getElementById('u-prenom')?.value?.trim();
    const nom              = document.getElementById('u-nom')?.value?.trim();
    const age              = parseInt(document.getElementById('u-age')?.value) || null;
    const ville            = document.getElementById('u-ville')?.value?.trim() || '';
    const telephone        = document.getElementById('u-tel')?.value?.trim() || '';
    const classement       = document.getElementById('u-classement')?.value || '';
    const niveau           = document.getElementById('u-niveau')?.value || '';
    const cote             = document.getElementById('u-cote')?.value || '';
    const frequence        = document.getElementById('u-frequence')?.value || '';
    const dispos           = [...document.querySelectorAll('[data-dispo]:checked')].map(el => el.dataset.dispo);
    const objectif         = document.getElementById('u-objectif')?.value || '';
    const palmares         = document.getElementById('u-palmares')?.value?.trim() || '';
    const cherchePartenaire = document.getElementById('u-cherche-partenaire')?.checked || false;
    const niveauPartenaire = document.getElementById('u-niveau-partenaire')?.value || '';
    const data = { prenom, nom, age, ville, telephone, classement, niveau, cote, frequence, dispos, objectif, palmares, cherchePartenaire, niveauPartenaire };
    DB.update('profiles', Auth.currentUser.id, data);
    Object.assign(Auth.currentUser, data);
    toast('✅ Profil enregistré');
    this.render();
  },

  saveCoachProfile(coachId) {
    const nom  = document.getElementById('c-nom')?.value;
    const spec = document.getElementById('c-spec')?.value;
    const ville = document.getElementById('c-ville')?.value;
    const bio  = document.getElementById('c-bio')?.value;
    const exp  = parseInt(document.getElementById('c-exp')?.value) || 0;
    const niveaux = [...document.querySelectorAll('[data-niveau]:checked')].map(el => el.dataset.niveau);
    const clubs = (this._editingClubs || DB.get('coaches').find(c=>c.id===coachId)?.clubs || []).filter(c => c.nom.trim());
    this._editingClubs = null;
    DB.update('coaches', coachId, { nom, specialite: spec, ville, bio, experience: exp, niveaux, clubs });
    toast('✅ Profil enregistré');
    this.render();
  },

  async uploadAvatar(inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { toast('❌ Image trop grande (max 4 Mo)'); return; }
    const userId = Auth.currentUser.id;
    const ext = file.name.split('.').pop();
    const path = `${userId}/avatar.${ext}`;
    toast('⏳ Upload en cours…');
    const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
    if (error) { toast('❌ Erreur upload : ' + error.message); return; }
    const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
    await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', userId);
    Auth.currentUser.avatarUrl = publicUrl;
    // Si coach, mettre à jour aussi la fiche coach
    if (Auth.currentUser.coachId) {
      await sb.from('coaches').update({ avatar_url: publicUrl }).eq('id', Auth.currentUser.coachId);
      const coach = DB.get('coaches').find(c => c.id === Auth.currentUser.coachId);
      if (coach) coach.avatarUrl = publicUrl;
    }
    toast('✅ Photo mise à jour !');
    this.render();
  },

  async uploadDiplome(inputEl, coachId) {
    const file = inputEl.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { toast('❌ Fichier trop grand (max 4 Mo)'); return; }
    const ext = file.name.split('.').pop();
    const path = `${coachId}/diplome.${ext}`;
    toast('⏳ Upload en cours…');
    const { error } = await sb.storage.from('diplomes').upload(path, file, { upsert: true });
    if (error) { toast('❌ Erreur : ' + error.message); return; }
    const { data: { publicUrl } } = sb.storage.from('diplomes').getPublicUrl(path);
    await sb.from('coaches').update({ diplome_url: publicUrl }).eq('id', coachId);
    const coach = DB.get('coaches').find(c => c.id === coachId);
    if (coach) coach.diplomeUrl = publicUrl;
    toast('✅ Diplôme déposé !');
    this.render();
  },

  changePlan(coachId, plan) {
    const expiry = new Date();
    expiry.setMonth(expiry.getMonth() + (plan === 'decouverte' ? 1 : 6));
    DB.update('coaches', coachId, { plan, planExpiry: expiry.toISOString(), planActive: true });
    toast(`✅ Formule ${PLANS[plan].label} activée !`);
    this.render();
  },

    saveTarifs(coachId) {
    const tarifs = {
      solo:      parseInt(document.getElementById('tarif-solo')?.value)      || 60,
      duo:       parseInt(document.getElementById('tarif-duo')?.value)       || 40,
      trio:      parseInt(document.getElementById('tarif-trio')?.value)      || 35,
      collectif: parseInt(document.getElementById('tarif-collectif')?.value) || 25,
    };
    DB.update('coaches', coachId, { tarifs });
    toast('✅ Tarifs enregistrés');
    this.render();
  },

// Animations scroll — Intersection Observer
function initScrollAnimations() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.anim-fade').forEach(el => obs.observe(el));
}

async function sendEmail({ to, subject, html }) {
  if (!to) return;
  try {
    await fetch('/.netlify/functions/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to, subject, html })
    });
  } catch(e) { console.warn('sendEmail failed:', e); }
}

// ============================================================
// BOOT
// ============================================================
(async function init() {
  // Détecter URL publique coach : /coach/[id]
  const pathMatch = window.location.pathname.match(/^\/coach\/([^/]+)/);

  // Redirection immédiate depuis localStorage
  const cachedRole = localStorage.getItem('pb_role');
  if (pathMatch) {
    App.view = 'profile';
  } else if (cachedRole === 'coach') App.view = 'coach-dashboard';
  else if (cachedRole === 'admin') App.view = 'admin';
  else if (cachedRole === 'user') App.view = 'search';

  document.getElementById('app').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#8888aa">Chargement…</div>';

  await Auth.restore();
  await DB.init();
  requestNotifPermission();

  if (pathMatch) {
    App.selectedCoach = pathMatch[1];
    App.view = 'profile';
  } else if (Auth.currentUser) {
    const role = Auth.currentUser.role;
    if (role) localStorage.setItem('pb_role', role);
    if (App.view === 'home') {
      if (role === 'admin') App.view = 'admin';
      else if (role === 'coach') App.view = 'coach-dashboard';
      else App.view = 'search';
    }
  } else if (!cachedRole) {
    App.view = 'home';
  }
  App.render();
})();
